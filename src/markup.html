<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud" data-mode="run">
    <div id="cross"><i></i><i></i><i></i><i></i></div>
    <div id="hitmark"><b></b><b></b><b></b><b></b></div>
    <div id="dmg"></div>
    <div id="lowvig"></div>

    <div class="panel" id="topbar">
      <div><div class="k">Wave</div><div class="v acc" id="uiWave"></div></div>
      <div><div class="k">Warden in</div><div class="v" id="uiBossIn"></div></div>
    </div>
    <div class="panel" id="meltbar">
      <div class="n"><span>Reactor charge</span><span id="uiCharge">0%</span></div>
      <div class="bar"><div class="fill" id="chargeFill"></div></div>
      <div class="shards"><span>Shards</span> <b id="uiHeld">0</b> held &middot; <b id="uiBanked">0</b> banked <em id="uiExtract"></em></div>
    </div>
    <div class="panel" id="trialbar">
      <div class="k" id="uiTrialName"></div>
      <div class="v"><span id="uiTrialGoal"></span><small id="uiTrialTime"></small></div>
    </div>
    <div id="compass"></div>

    <div class="panel" id="bossbar">
      <div class="n"><span id="bossName"></span><span id="bossHp"></span></div>
      <div class="bar"><div class="fill" id="bossFill"></div></div>
    </div>

    <div class="panel" id="range">
      <div class="k">Practice range</div>
      <div class="row"><div><div class="k">DPS</div><div class="v" id="rgDps">0</div></div>
      <div><div class="k">Hits</div><div class="v" id="rgHits">0</div></div>
      <div><div class="k">Targets</div><div class="v" id="rgTargets">0</div></div></div>
    </div>

    <div class="panel" id="lobbytag">
      <div class="k">Operative</div><div class="v" id="lbChar"></div>
      <div class="h"><kbd>1</kbd>&ndash;<kbd>6</kbd> swap &nbsp; <kbd>Tab</kbd> roster</div>
    </div>

    <div class="panel" id="vitals">
      <div class="lbl"><span>Integrity</span><b id="uiChar"></b></div>
      <div id="hpbar"><div id="hpfill"></div><div id="shfill"></div></div>
      <div id="hpnum"><span class="hero"><b id="uiHp"></b><small>/ <span id="uiMaxHp"></span></small></span>
        <span class="stat"><i id="uiScrap">0</i> scrap &middot; <i id="uiLeft">0</i><em id="uiQueue"></em> hostile</span></div>
    </div>

    <div class="panel" id="items"></div>
    <div id="feed"></div>

    <div class="panel" id="ability">
      <div class="key" id="abKey"><i id="abFill"></i><span>Q</span></div>
      <div><div class="n" id="abName"></div><div class="d" id="abState"></div></div>
    </div>

    <div class="panel" id="ammo">
      <div class="row"><div class="big" id="uiMag"></div><div class="res" id="uiAmmoLbl"></div></div>
      <div id="reloadbar"><div id="reloadfill"></div></div>
    </div>

    <div id="prompt"><kbd>E</kbd><span id="promptTxt"></span></div>
    <div id="banner"><div class="t" id="bnT"></div><div class="s" id="bnS"></div></div>
  </div>

  <div id="screen">
    <div class="card" id="card"></div>
  </div>
  <div id="touch">
    <div class="zone" id="zoneL"></div>
    <div class="zone" id="zoneR"></div>
    <div id="stick"><i></i></div>
    <div class="tbtn" id="tFire">FIRE</div>
    <div class="tbtn" id="tAbil"><i></i><span id="tAbilTxt">Q<small>ability</small></span></div>
    <div class="tbtn" id="tJump">JUMP</div>
    <div class="tbtn" id="tReload">R<small>reload</small></div>
    <div class="tbtn" id="tInteract"><span id="tInteractTxt">Interact</span></div>
    <div class="tbtn" id="tPause">&#9646;&#9646;</div>
  </div>
  <div id="fade"></div>
  <div id="rotate"><b>Rotate your device</b>Ferrous Arena plays in landscape.</div>
  <div id="dbg"><span id="dbgTxt"></span><canvas id="dbgC" width="180" height="36"></canvas></div>
</div>
